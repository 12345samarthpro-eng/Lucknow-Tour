name: Build Lucknow Guide APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Ensure env files and debug keystore exist
        run: |
          [ -f .env.example ] || touch .env.example
          [ -f .env ] || touch .env
          if [ -s debug.keystore.base64 ] && tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null && [ -s debug.keystore ]; then
            echo "Decoded debug.keystore"
          else
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucknow-guide-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
